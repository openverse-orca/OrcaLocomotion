[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orcalab-rslrl"
version = "0.2.0"
description = "Product-grade GPU robot-learning framework for OrcaLab"
readme = "README.md"
authors = [{ name = "Benhuhuan", email = "benhu1337@gmail.com" }]
maintainers = [{ name = "Benhuhuan", email = "benhu1337@gmail.com" }]
requires-python = ">=3.12"
keywords = ["robotics", "reinforcement-learning", "orcalab", "rsl-rl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "torch>=2.6",
  "mujoco>=3.5",
  "warp-lang>=1.12",
  "mujoco-warp>=3.5",
  "tensorboard>=2.16",
  "tensordict>=0.7",
  "wandb>=0.17",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
orca = ["orca-lab>=26.5", "orca-gym>=26.5", "grpcio>=1.66", "gymnasium>=1.2"]
test = ["pytest>=8", "scipy>=1.16"]
dev = [
  "orca-lab>=26.5",
  "orca-gym>=26.5",
  "grpcio>=1.66",
  "gymnasium>=1.2",
  "pytest>=8",
  "scipy>=1.16",
]

[project.scripts]
orcarl = "orcalab_rslrl.tools.cli:main"

[tool.setuptools.packages.find]
include = ["orcalab_rslrl*", "rsl_rl*"]

[tool.setuptools.package-data]
orcalab_rslrl = [
  "py.typed",
  "tasks/*.xml",
  "assets/robots/unitree_g1/xmls/*.xml",
  "assets/robots/unitree_g1/xmls/assets/*.STL",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["orca_gpu: requires the Orca GPU runtime"]
