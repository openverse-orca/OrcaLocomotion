[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-rl"
version = "0.1.0"
description = "Standalone RSL-RL bridge package for OrcaLab and OrcaGym."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "BenHuHuan", email = "benhu1337@gmail.com" }]
dependencies = [
  "rsl-rl-lib==5.0.1",
  "numpy==2.2.6",
  "torch>=2.7.0",
  "orca-lab==26.6.3",
  "mujoco==3.7.0",
  "warp-lang==1.12.0",
  "mujoco-warp==3.5.0",
  "mjlab==1.2.0",
  "tensordict>=0.7.0",
  "onnx>=1.15.0",
  "onnxruntime>=1.17.0",
  "onnxscript>=0.5.4",
  "pynput>=1.7.6",
  "tensorboard>=2.20.0",
  "wandb>=0.22.3",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["orca_rl*"]

[tool.setuptools.package-data]
orca_rl = ["assets/**/*"]
